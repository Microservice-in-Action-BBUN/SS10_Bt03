server:
  port: 8080

spring:
  application:
    name: storex-promotion-webflux
  main:
    web-application-type: reactive

services:
  promotion-service:
    url: http://promotion-service
    connect-timeout-ms: 2000
    read-timeout-seconds: 2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.storex.promotion: DEBUG
    reactor.netty.http.client: INFO
